<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Metrics</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0a0b; --panel:#141416; --panel2:#1b1b1e; --line:rgba(255,255,255,.08);
      --ink:#f5f5f4; --dim:#a3a3a3; --dim2:#737373; --accent:#e8e8e8;
      --pos:#5ad19a; --blue:#5aa0ff; --font:'Inter',-apple-system,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .wrap{max-width:1120px;margin:0 auto;padding:2rem 1.25rem 4rem}

    /* login */
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .gate form{width:100%;max-width:340px;text-align:center}
    .gate h1{font-size:1.1rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:1.5rem;color:var(--dim)}
    .gate input{width:100%;padding:.85rem 1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;text-align:center;letter-spacing:.1em}
    .gate input:focus{outline:none;border-color:rgba(255,255,255,.3)}
    .gate button{width:100%;margin-top:.75rem;padding:.85rem;background:var(--ink);color:#000;border:none;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
    .gate .err{margin-top:.9rem;min-height:1.2em;font-size:.82rem;color:#ff6b7d}

    header.top{display:flex;flex-wrap:wrap;gap:1rem;align-items:baseline;justify-content:space-between;margin-bottom:1.5rem}
    header.top h1{font-size:1.15rem;font-weight:700;letter-spacing:.02em}
    header.top .sub{color:var(--dim2);font-size:.78rem;margin-top:.2rem}
    .controls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .seg button{background:none;border:none;color:var(--dim);font:inherit;font-size:.8rem;padding:.5rem .8rem;cursor:pointer}
    .seg button.on{background:var(--panel2);color:var(--ink)}
    .ghost{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:.5rem .8rem;font:inherit;font-size:.8rem;cursor:pointer}

    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.25rem}
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
    .kpi .n{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
    .kpi .l{color:var(--dim2);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-top:.25rem}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.15rem;margin-bottom:.85rem}
    .card h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);margin-bottom:.9rem;font-weight:600}
    .full{grid-column:1 / -1}

    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th{text-align:left;color:var(--dim2);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
    td{padding:.5rem .5rem;border-bottom:1px solid rgba(255,255,255,.04);color:var(--dim)}
    td.v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    td.path{color:var(--ink);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pill{display:inline-block;font-size:.68rem;padding:.1rem .45rem;border-radius:999px;background:var(--panel2);color:var(--dim);margin-right:.4rem}
    .muted{color:var(--dim2);font-size:.8rem}

    .bars{display:flex;align-items:flex-end;gap:3px;height:120px}
    .bars .b{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
    .axis{display:flex;justify-content:space-between;color:var(--dim2);font-size:.68rem;margin-top:.4rem}

    .map-head{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
    select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.8rem;padding:.4rem .6rem;border-radius:8px;max-width:100%}
    .map{position:relative;width:100%;aspect-ratio:16/10;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.03) 39px,rgba(255,255,255,.03) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.03) 39px,rgba(255,255,255,.03) 40px),var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(90,160,255,.55);box-shadow:0 0 8px rgba(90,160,255,.5)}
    @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <!-- Password gate -->
  <div class="gate" id="gate">
    <form id="gateForm">
      <h1>Metrics</h1>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
      <button type="submit" id="enter">Enter</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <!-- Dashboard -->
  <div class="wrap" id="dash" hidden>
    <header class="top">
      <div>
        <h1>Site metrics</h1>
        <div class="sub" id="genAt"></div>
      </div>
      <div class="controls">
        <div class="seg" id="rangeSeg">
          <button data-d="7">7d</button>
          <button data-d="30" class="on">30d</button>
          <button data-d="90">90d</button>
        </div>
        <button class="ghost" id="refresh">Refresh</button>
        <button class="ghost" id="logout">Lock</button>
      </div>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="card full">
      <h2>Visits per day</h2>
      <div class="bars" id="bars"></div>
      <div class="axis" id="barsAxis"></div>
    </div>

    <div class="card full">
      <h2>By site</h2>
      <div id="bySite"></div>
    </div>

    <div class="grid">
      <div class="card"><h2>Top pages</h2><div id="topPages"></div></div>
      <div class="card"><h2>Most clicked</h2><div id="topClicks"></div></div>
      <div class="card"><h2>Referrers</h2><div id="referrers"></div></div>
      <div class="card"><h2>Where people click</h2>
        <div class="map-head">
          <select id="mapSel"></select>
          <span class="muted" id="mapCount"></span>
        </div>
        <div class="map" id="map"></div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    var SUPABASE_URL='https://pjhprqoozwvftzuhgtdr.supabase.co';
    var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqaHBycW9vend2ZnR6dWhndGRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTY4NTgsImV4cCI6MjA4ODk3Mjg1OH0.jmB5UQNyShOGZVm4Za9FH4lyoPFgdITtjyJ-11iO3co';

    var pw=null, days=30, data=null;
    var $=function(id){return document.getElementById(id)};

    function fmt(n){ n=n||0; return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':String(n); }
    function dur(s){ s=s||0; if(s<60) return s+'s'; var m=Math.floor(s/60); return m+'m '+(s%60)+'s'; }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])}); }

    function call(p, d){
      return fetch(SUPABASE_URL+'/rest/v1/rpc/get_site_analytics',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},
        body:JSON.stringify({pw:p, since_days:d})
      }).then(function(r){
        if(r.status===401||r.status===403||r.status===400) return r.json().then(function(j){throw {auth:true,j:j}});
        if(!r.ok) throw {auth:false};
        return r.json();
      });
    }

    // ---- gate ----
    $('gateForm').addEventListener('submit',function(e){
      e.preventDefault();
      var val=$('pw').value;
      $('err').textContent=''; $('enter').textContent='…';
      call(val, days).then(function(res){
        pw=val; data=res; $('gate').hidden=true; $('dash').hidden=false; render();
      }).catch(function(err){
        $('enter').textContent='Enter';
        if(err && err.auth) $('err').textContent='Wrong password.';
        else $('err').textContent='Backend not reachable (has the SQL migration been applied?).';
      });
    });

    function load(){
      if(pw==null) return;
      call(pw, days).then(function(res){ data=res; render(); }).catch(function(){});
    }
    $('refresh').addEventListener('click', load);
    $('logout').addEventListener('click', function(){ pw=null; data=null; $('pw').value=''; $('dash').hidden=true; $('gate').hidden=false; $('enter').textContent='Enter'; });
    $('rangeSeg').addEventListener('click', function(e){
      var b=e.target.closest('button'); if(!b) return;
      days=+b.dataset.d;
      [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});
      load();
    });

    // ---- render ----
    function render(){
      if(!data) return;
      var t=data.totals||{};
      $('genAt').textContent='Last '+data.range_days+' days · updated '+new Date(data.generated_at).toLocaleString();
      $('kpis').innerHTML=[
        ['Page views', fmt(t.pageviews)],
        ['Unique visits', fmt(t.sessions)],
        ['Clicks', fmt(t.clicks)],
        ['Avg. time on page', dur(t.avg_seconds)]
      ].map(function(k){return '<div class="kpi"><div class="n">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>'}).join('');

      // daily bars
      var daily=data.daily||[]; var max=1;
      daily.forEach(function(d){ if(d.pageviews>max) max=d.pageviews; });
      $('bars').innerHTML=daily.map(function(d){
        var h=Math.round((d.pageviews/max)*100);
        return '<div class="b" title="'+d.day+': '+d.pageviews+' views, '+d.sessions+' visits" style="height:'+h+'%"></div>';
      }).join('') || '<span class="muted">No data yet.</span>';
      $('barsAxis').innerHTML = daily.length ? '<span>'+daily[0].day+'</span><span>'+daily[daily.length-1].day+'</span>' : '';

      // by site
      var bs=data.by_site||[];
      $('bySite').innerHTML = bs.length ? tbl(['Site','Views','Visits','Clicks','Avg time'],
        bs.map(function(s){return ['<span class="pill">'+esc(s.site)+'</span>', s.pageviews, s.sessions, s.clicks, dur(s.avg_seconds)]}), [0]) : '<span class="muted">No data yet.</span>';

      // top pages
      var tp=data.top_pages||[];
      $('topPages').innerHTML = tp.length ? tbl(['Site','Page','Views'],
        tp.map(function(p){return ['<span class="pill">'+esc(p.site)+'</span>', '<span class="path">'+esc(p.path)+'</span>', p.views]}), [0,1]) : '<span class="muted">No data.</span>';

      // top clicks
      var tc=data.top_clicks||[];
      $('topClicks').innerHTML = tc.length ? tbl(['Element','Clicks'],
        tc.map(function(c){return ['<span class="path">'+esc(c.target)+'</span>', c.n]}), [0]) : '<span class="muted">No data.</span>';

      // referrers
      var rf=data.referrers||[];
      $('referrers').innerHTML = rf.length ? tbl(['Source','Views'],
        rf.map(function(r){return ['<span class="path">'+esc(r.referrer)+'</span>', r.n]}), [0]) : '<span class="muted">No data.</span>';

      // click map selector
      var clicks=data.clicks||[];
      var keys={};
      clicks.forEach(function(c){ var k=c.site+' · '+c.path; keys[k]=(keys[k]||0)+1; });
      var opts=Object.keys(keys).sort(function(a,b){return keys[b]-keys[a]});
      var sel=$('mapSel');
      sel.innerHTML=opts.map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+' ('+keys[k]+')</option>'}).join('') || '<option>No clicks yet</option>';
      drawMap();
      sel.onchange=drawMap;
      function drawMap(){
        var key=sel.value;
        var pts=clicks.filter(function(c){return (c.site+' · '+c.path)===key;});
        $('mapCount').textContent = pts.length ? pts.length+' clicks' : '';
        $('map').innerHTML = pts.map(function(p){
          return '<div class="dot" title="'+esc(p.target)+'" style="left:'+(Math.max(0,Math.min(1,p.x))*100)+'%;top:'+(Math.max(0,Math.min(1,p.y))*100)+'%"></div>';
        }).join('');
      }
    }

    function tbl(head, rows, htmlCols){
      htmlCols=htmlCols||[];
      var h='<table><thead><tr>'+head.map(function(x,i){return '<th'+(i>=1&&htmlCols.indexOf(i)<0?' style="text-align:right"':'')+'>'+x+'</th>'}).join('')+'</tr></thead><tbody>';
      h+=rows.map(function(r){
        return '<tr>'+r.map(function(c,i){
          var isHtml=htmlCols.indexOf(i)>=0;
          return isHtml?('<td>'+c+'</td>'):('<td class="v">'+esc(c)+'</td>');
        }).join('')+'</tr>';
      }).join('');
      return h+'</tbody></table>';
    }
  })();
  </script>
</body>
</html>
