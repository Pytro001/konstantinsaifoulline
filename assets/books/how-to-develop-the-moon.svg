<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <radialGradient id="moonLight" cx="30%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#b9b8b4"/>
      <stop offset="30%" stop-color="#8c8b87"/>
      <stop offset="55%" stop-color="#54534f"/>
      <stop offset="76%" stop-color="#242423"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5d0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffca6a" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ff9a00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="moonClip"><circle cx="150" cy="470" r="330"/></clipPath>
  </defs>

  <rect width="600" height="900" fill="#000000"/>

  <!-- moon -->
  <g clip-path="url(#moonClip)">
    <circle cx="150" cy="470" r="330" fill="url(#moonLight)"/>
    <g fill="#000" opacity="0.13">
      <ellipse cx="60" cy="300" rx="52" ry="44"/>
      <ellipse cx="185" cy="235" rx="34" ry="30"/>
      <ellipse cx="270" cy="360" rx="26" ry="23"/>
      <ellipse cx="95" cy="470" rx="66" ry="58"/>
      <ellipse cx="235" cy="545" rx="40" ry="35"/>
      <ellipse cx="30" cy="640" rx="58" ry="50"/>
      <ellipse cx="160" cy="690" rx="46" ry="40"/>
      <ellipse cx="300" cy="640" rx="24" ry="21"/>
      <ellipse cx="120" cy="180" rx="22" ry="19"/>
      <ellipse cx="255" cy="450" rx="18" ry="16"/>
    </g>
    <g fill="#ffffff" opacity="0.10">
      <ellipse cx="70" cy="288" rx="46" ry="38"/>
      <ellipse cx="105" cy="455" rx="58" ry="50"/>
      <ellipse cx="170" cy="678" rx="40" ry="34"/>
      <ellipse cx="192" cy="225" rx="28" ry="24"/>
    </g>
    <g fill="#000" opacity="0.09">
      <circle cx="215" cy="300" r="12"/><circle cx="140" cy="360" r="9"/>
      <circle cx="60" cy="405" r="14"/><circle cx="205" cy="620" r="11"/>
      <circle cx="285" cy="520" r="8"/><circle cx="115" cy="600" r="10"/>
    </g>
  </g>

  <!-- impact flare on the terminator -->
  <circle cx="243" cy="330" r="34" fill="url(#flare)"/>
  <g stroke="#ffd68a" stroke-width="2" opacity=".85" stroke-linecap="round">
    <line x1="243" y1="308" x2="243" y2="352"/>
    <line x1="221" y1="330" x2="265" y2="330"/>
    <line x1="228" y1="315" x2="258" y2="345"/>
    <line x1="258" y1="315" x2="228" y2="345"/>
  </g>
  <circle cx="243" cy="330" r="4.5" fill="#fffdf3"/>

  <!-- title -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" fill="#ffffff" font-size="62">
    <text x="292" y="96">How To</text>
    <text x="292" y="172">Develop</text>
    <text x="292" y="248">The</text>
    <text x="292" y="324">Moon</text>
  </g>

  <!-- author -->
  <text x="560" y="856" text-anchor="end" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="42" fill="#ffffff">Ian Long</text>
</svg>
