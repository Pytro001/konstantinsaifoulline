<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <!-- lit along the left limb, falling into shadow toward the terminator -->
    <radialGradient id="surf" cx="8%" cy="46%" r="92%">
      <stop offset="0%"   stop-color="#d4d0ce"/>
      <stop offset="26%"  stop-color="#aeaaa9"/>
      <stop offset="48%"  stop-color="#83807f"/>
      <stop offset="68%"  stop-color="#565353"/>
      <stop offset="86%"  stop-color="#2a2829"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <!-- diagonal terminator: bright lower-left, dark upper-right -->
    <linearGradient id="term" x1="10%" y1="0%" x2="86%" y2="78%">
      <stop offset="0%"   stop-color="#000" stop-opacity=".92"/>
      <stop offset="22%"  stop-color="#000" stop-opacity=".62"/>
      <stop offset="44%"  stop-color="#000" stop-opacity=".22"/>
      <stop offset="62%"  stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff4d6"/>
      <stop offset="30%"  stop-color="#ffb45a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="moon"><circle cx="110" cy="640" r="440"/></clipPath>
  </defs>

  <rect width="600" height="900" fill="#000000"/>

  <g clip-path="url(#moon)">
    <circle cx="110" cy="640" r="440" fill="url(#surf)"/>

    <!-- maria -->
    <g fill="#000" opacity=".15">
      <ellipse cx="20"  cy="430" rx="120" ry="86" transform="rotate(-16 20 430)"/>
      <ellipse cx="165" cy="720" rx="130" ry="95" transform="rotate(10 165 720)"/>
      <ellipse cx="-40" cy="820" rx="110" ry="88"/>
    </g>

    <!-- craters -->
    <g fill="#000" opacity=".22">
      <ellipse cx="-10" cy="330" rx="38" ry="32"/>
      <ellipse cx="105" cy="455" rx="26" ry="22"/>
      <ellipse cx="35"  cy="580" rx="44" ry="38"/>
      <ellipse cx="200" cy="600" rx="23" ry="20"/>
      <ellipse cx="90"  cy="790" rx="35" ry="30"/>
      <ellipse cx="235" cy="835" rx="28" ry="24"/>
      <ellipse cx="-25" cy="690" rx="30" ry="26"/>
      <ellipse cx="160" cy="905" rx="26" ry="22"/>
      <ellipse cx="285" cy="720" rx="19" ry="16"/>
      <ellipse cx="140" cy="345" rx="18" ry="15"/>
    </g>
    <g fill="#e8e4e2" opacity=".14">
      <ellipse cx="-15" cy="322" rx="34" ry="28"/>
      <ellipse cx="30"  cy="571" rx="40" ry="33"/>
      <ellipse cx="85"  cy="781" rx="31" ry="26"/>
      <ellipse cx="196" cy="592" rx="19" ry="16"/>
    </g>
    <g fill="#000" opacity=".15">
      <circle cx="60"  cy="385" r="11"/><circle cx="135" cy="520" r="10"/>
      <circle cx="10"  cy="490" r="14"/><circle cx="225" cy="670" r="11"/>
      <circle cx="105" cy="655" r="9"/> <circle cx="175" cy="775" r="12"/>
      <circle cx="258" cy="620" r="8"/> <circle cx="55"  cy="880" r="11"/>
      <circle cx="85"  cy="270" r="9"/> <circle cx="215" cy="500" r="7"/>
    </g>

    <rect x="-600" y="-200" width="1400" height="1500" fill="url(#term)"/>
  </g>

  <!-- lit settlement on the terminator -->
  <circle cx="232" cy="424" r="38" fill="url(#flare)"/>
  <g stroke="#ffc271" stroke-width="2.2" opacity=".9" stroke-linecap="round">
    <line x1="232" y1="400" x2="232" y2="448"/>
    <line x1="208" y1="424" x2="256" y2="424"/>
    <line x1="215" y1="407" x2="249" y2="441"/>
    <line x1="249" y1="407" x2="215" y2="441"/>
  </g>
  <circle cx="232" cy="424" r="5" fill="#fffaf0"/>

  <!-- title -->
  <g font-family="Haettenschweiler,'Arial Narrow',Impact,'Helvetica Neue Condensed Bold',sans-serif"
     font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="566" y="150" font-size="126">How To</text>
    <text x="566" y="286" font-size="126">Develop</text>
    <text x="566" y="422" font-size="126">The</text>
    <text x="566" y="558" font-size="126">Moon</text>
    <text x="566" y="860" font-size="84">Ian Long</text>
  </g>
</svg>
