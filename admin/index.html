<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Pytro Admin — Tour Dates</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../favicon.png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav scrolled" aria-label="Admin navigation">
    <a class="nav-logo" href="../">PYTRO</a>
    <div class="nav-links">
      <a href="../#numbers">Numbers</a>
      <a href="../#shows">Shows</a>
      <a href="../#press">Press</a>
      <a href="../#booking">Booking</a>
    </div>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <main class="admin-main">
    <p class="section-kicker">Private page</p>
    <h1 class="admin-title">Tour Admin</h1>

    <section class="admin-card" id="adminLoginCard" aria-label="Admin login">
      <form class="login-form" id="adminLoginForm">
        <div class="field">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button-primary" type="submit">Enter admin</button>
        <p class="form-message" id="adminMessage" aria-live="polite"></p>
      </form>
    </section>

    <section class="admin-card" id="adminPanel" hidden>
      <div class="split-heading">
        <div>
          <p class="section-kicker">Upcoming dates</p>
          <h2>Add or delete shows</h2>
        </div>
        <button class="button button-ghost" id="adminLogout" type="button">Log out</button>
      </div>

      <form class="admin-form" id="tourDateForm">
        <div class="form-grid">
          <div class="field">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required>
          </div>
          <div class="field">
            <label for="city">City</label>
            <input id="city" name="city" type="text" placeholder="Berlin" required>
          </div>
          <div class="field">
            <label for="venue">Venue</label>
            <input id="venue" name="venue" type="text" placeholder="Club / festival" required>
          </div>
          <div class="field">
            <label for="country">Country</label>
            <input id="country" name="country" type="text" placeholder="Germany">
          </div>
          <div class="field field-full">
            <label for="ticketUrl">Ticket URL</label>
            <input id="ticketUrl" name="ticketUrl" type="url" placeholder="https://">
          </div>
          <div class="field field-full">
            <label for="note">Note</label>
            <textarea id="note" name="note" placeholder="Mainstage, support, lineup note, etc."></textarea>
          </div>
        </div>
        <div class="admin-actions">
          <button class="button button-primary" type="submit">Save date</button>
          <a class="button button-ghost" href="../#shows">View site</a>
        </div>
        <p class="form-message" id="adminPanelMessage" aria-live="polite"></p>
      </form>

      <div class="admin-list" id="adminDateList" aria-live="polite"></div>
      <p class="admin-help">This static admin stores dates in this browser's local storage. A backend is required if the dates should update for every visitor automatically.</p>
    </section>
  </main>

  <script src="../script.js"></script>
</body>
</html>
