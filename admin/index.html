<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0a0b;--panel:#141416;--panel2:#1b1b1e;--line:rgba(255,255,255,.08);
      --ink:#f5f5f4;--dim:#a3a3a3;--dim2:#737373;--blue:#5aa0ff;--font:'Inter',-apple-system,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}

    /* login */
    #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    #gate form{width:100%;max-width:320px;text-align:center}
    #gate h1{font-size:1rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.4rem;color:var(--dim)}
    #gate input{width:100%;padding:.85rem 1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;text-align:center;letter-spacing:.1em}
    #gate input:focus{outline:none;border-color:rgba(255,255,255,.3)}
    #gate button{width:100%;margin-top:.7rem;padding:.85rem;background:var(--ink);color:#000;border:none;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
    #gate .err{margin-top:.9rem;min-height:1.2em;font-size:.82rem;color:#ff6b7d}

    /* shown on the public site — the admin only works locally */
    #nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    #nf .c{font-size:clamp(3rem,12vw,6rem);font-weight:800;letter-spacing:-.03em;line-height:1}
    #nf .m{color:var(--dim);margin:.6rem 0 1.4rem;font-size:1rem}
    #nf .h{color:var(--dim2);font-size:.85rem;text-decoration:none;border:1px solid var(--line);padding:.55rem 1rem;border-radius:999px}

    .wrap{max-width:1120px;margin:0 auto;padding:2rem 1.25rem 4rem}
    header.top{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin-bottom:1.4rem}
    header.top h1{font-size:1.15rem;font-weight:700}
    .tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .tabs button{background:none;border:none;color:var(--dim);font:inherit;font-size:.85rem;padding:.55rem 1rem;cursor:pointer}
    .tabs button.on{background:var(--panel2);color:var(--ink)}
    .controls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
    .seg button{background:none;border:none;color:var(--dim);font:inherit;font-size:.8rem;padding:.5rem .8rem;cursor:pointer}
    .seg button.on{background:var(--panel2);color:var(--ink)}
    .ghost{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:.5rem .8rem;font:inherit;font-size:.8rem;cursor:pointer}
    .sub{color:var(--dim2);font-size:.78rem;margin-top:.2rem}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.25rem}
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
    .kpi .n{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
    .kpi .l{color:var(--dim2);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-top:.25rem}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.15rem;margin-bottom:.85rem}
    .card h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);margin-bottom:.9rem;font-weight:600}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th{text-align:left;color:var(--dim2);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
    td{padding:.55rem .5rem;border-bottom:1px solid rgba(255,255,255,.04);color:var(--dim);vertical-align:top}
    td.v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    td.k{color:var(--ink)}
    .pill{display:inline-block;font-size:.68rem;padding:.1rem .45rem;border-radius:999px;background:var(--panel2);color:var(--dim);margin-right:.4rem}
    .muted{color:var(--dim2);font-size:.85rem}
    a.lnk{color:var(--blue);text-decoration:none}
    .bars{display:flex;align-items:flex-end;gap:3px;height:120px}
    .bars .b{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
    .axis{display:flex;justify-content:space-between;color:var(--dim2);font-size:.68rem;margin-top:.4rem}
    .map-head{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
    select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.8rem;padding:.4rem .6rem;border-radius:8px;max-width:100%}
    .map{position:relative;width:100%;aspect-ratio:16/10;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(90,160,255,.55);box-shadow:0 0 8px rgba(90,160,255,.5)}
    @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="gate">
    <form id="gateForm">
      <h1>Admin</h1>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
      <button type="submit" id="enter">Log in</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div class="wrap" id="dash" hidden>
    <header class="top">
      <div><h1>Admin</h1><div class="sub" id="genAt"></div></div>
      <div class="controls">
        <div class="tabs" id="tabs">
          <button data-t="sponsors" class="on">Sponsors</button>
          <button data-t="metrics">Metrics</button>
        </div>
        <div class="seg" id="rangeSeg" hidden>
          <button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button>
        </div>
        <button class="ghost" id="refresh">Refresh</button>
        <button class="ghost" id="logout">Log out</button>
      </div>
    </header>

    <section id="paneSponsors">
      <div class="kpis" id="spKpis"></div>
      <div class="card"><h2>Sponsorship applications</h2><div id="spTable"></div></div>
    </section>

    <section id="paneMetrics" hidden>
      <div class="kpis" id="kpis"></div>
      <div class="card"><h2>Visits per day</h2><div class="bars" id="bars"></div><div class="axis" id="barsAxis"></div></div>
      <div class="card"><h2>By site</h2><div id="bySite"></div></div>
      <div class="grid2">
        <div class="card"><h2>Top pages</h2><div id="topPages"></div></div>
        <div class="card"><h2>Most clicked</h2><div id="topClicks"></div></div>
        <div class="card"><h2>Referrers</h2><div id="referrers"></div></div>
        <div class="card"><h2>Where people click</h2>
          <div class="map-head"><select id="mapSel"></select><span class="muted" id="mapCount"></span></div>
          <div class="map" id="map"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
  (function(){
    var AIRSUP='https://fyxqdwhqposxitexydby.supabase.co';
    var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5eHFkd2hxcG9zeGl0ZXh5ZGJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNzk5MDgsImV4cCI6MjA5MTc1NTkwOH0.cvpnWJvVsQx_qEk4hNDAtJZ_M8qNv4RNnhRJBRgulg8';
    var $=function(id){return document.getElementById(id)};
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])})}
    function fmt(n){n=n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':String(n)}
    function dur(s){s=s||0;if(s<60)return s+'s';var m=Math.floor(s/60);return m+'m '+(s%60)+'s'}

    var pw=null, days=30, analytics=null, sponsors=null;

    function rpc(fn, body){
      return fetch(AIRSUP+'/rest/v1/rpc/'+fn,{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},
        body:JSON.stringify(body)
      }).then(function(r){ if(r.status===400||r.status===401||r.status===403) return r.json().then(function(j){throw {auth:true}}); if(!r.ok) throw {auth:false}; return r.json(); });
    }

    // ---- login: verify server-side (get_sponsor_apps errors on wrong pw) ----
    $('gateForm').addEventListener('submit',function(e){
      e.preventDefault();
      var val=$('pw').value; $('err').textContent=''; $('enter').textContent='…';
      rpc('get_sponsor_apps',{pw:val}).then(function(sp){
        pw=val; sponsors=sp; $('gate').style.display='none'; $('dash').hidden=false;
        renderSponsors(); loadMetrics();
      }).catch(function(err){
        $('enter').textContent='Log in';
        $('err').textContent = err&&err.auth ? 'Wrong password.' : 'Could not connect.';
      });
    });

    function loadMetrics(){ rpc('web_site_analytics',{pw:pw,since_days:days}).then(function(a){analytics=a;renderMetrics()}).catch(function(){analytics=null;renderMetrics()}); }
    function reload(){ if(!pw) return; rpc('get_sponsor_apps',{pw:pw}).then(function(s){sponsors=s;renderSponsors()}).catch(function(){}); loadMetrics(); }

    // ---- sponsors ----
    function renderSponsors(){
      var apps=sponsors||[], total=apps.length;
      var last30=apps.filter(function(a){return (Date.now()-new Date(a.ts))/86400000<=30}).length;
      $('spKpis').innerHTML=[['Applications',total],['Last 30 days',last30]].map(function(k){return '<div class="kpi"><div class="n">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>'}).join('');
      if(!total){ $('spTable').innerHTML='<span class="muted">No applications yet.</span>'; return; }
      $('spTable').innerHTML='<table><thead><tr><th>Date</th><th>Company</th><th>Contact</th><th>Budget</th><th>Message</th></tr></thead><tbody>'+apps.map(function(a){
        var site=a.website?'<a class="lnk" href="'+(/^https?:/.test(a.website)?a.website:'https://'+a.website)+'" target="_blank" rel="noopener">'+esc(a.website)+'</a>':'';
        return '<tr><td class="k">'+new Date(a.ts).toLocaleDateString()+'</td><td class="k">'+esc(a.company||'')+(a.contact_name?'<br><span class="muted">'+esc(a.contact_name)+'</span>':'')+'</td><td><a class="lnk" href="mailto:'+esc(a.email)+'">'+esc(a.email||'')+'</a>'+(site?'<br>'+site:'')+'</td><td class="k">'+esc(a.budget||'')+'</td><td>'+esc(a.message||'')+'</td></tr>';
      }).join('')+'</tbody></table>';
    }

    // ---- metrics ----
    function tbl(head, rows, htmlCols){
      htmlCols=htmlCols||[];
      var h='<table><thead><tr>'+head.map(function(x,i){return '<th'+(i>=1&&htmlCols.indexOf(i)<0?' style="text-align:right"':'')+'>'+x+'</th>'}).join('')+'</tr></thead><tbody>';
      h+=rows.map(function(r){return '<tr>'+r.map(function(c,i){return htmlCols.indexOf(i)>=0?('<td>'+c+'</td>'):('<td class="v">'+esc(c)+'</td>')}).join('')+'</tr>'}).join('');
      return h+'</tbody></table>';
    }
    function renderMetrics(){
      var d=analytics;
      if(!d){ $('kpis').innerHTML='<div class="muted">Analytics not reachable yet.</div>'; return; }
      var t=d.totals||{};
      $('genAt').textContent='Last '+d.range_days+' days · '+new Date(d.generated_at).toLocaleString();
      $('kpis').innerHTML=[['Page views',fmt(t.pageviews)],['Unique visits',fmt(t.sessions)],['Clicks',fmt(t.clicks)],['Avg. time',dur(t.avg_seconds)]].map(function(k){return '<div class="kpi"><div class="n">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>'}).join('');
      var daily=d.daily||[],max=1; daily.forEach(function(x){if(x.pageviews>max)max=x.pageviews});
      $('bars').innerHTML=daily.map(function(x){return '<div class="b" title="'+x.day+': '+x.pageviews+' views" style="height:'+Math.round(x.pageviews/max*100)+'%"></div>'}).join('')||'<span class="muted">No data yet.</span>';
      $('barsAxis').innerHTML=daily.length?'<span>'+daily[0].day+'</span><span>'+daily[daily.length-1].day+'</span>':'';
      var bs=d.by_site||[];
      $('bySite').innerHTML=bs.length?tbl(['Site','Views','Visits','Clicks','Avg time'],bs.map(function(s){return['<span class="pill">'+esc(s.site)+'</span>',s.pageviews,s.sessions,s.clicks,dur(s.avg_seconds)]}),[0]):'<span class="muted">No data yet.</span>';
      var tp=d.top_pages||[];
      $('topPages').innerHTML=tp.length?tbl(['Site','Page','Views'],tp.map(function(p){return['<span class="pill">'+esc(p.site)+'</span>','<span>'+esc(p.path)+'</span>',p.views]}),[0,1]):'<span class="muted">No data.</span>';
      var tc=d.top_clicks||[];
      $('topClicks').innerHTML=tc.length?tbl(['Element','Clicks'],tc.map(function(c){return['<span>'+esc(c.target)+'</span>',c.n]}),[0]):'<span class="muted">No data.</span>';
      var rf=d.referrers||[];
      $('referrers').innerHTML=rf.length?tbl(['Source','Views'],rf.map(function(r){return['<span>'+esc(r.referrer)+'</span>',r.n]}),[0]):'<span class="muted">No data.</span>';
      var clicks=d.clicks||[],keys={};
      clicks.forEach(function(c){var k=c.site+' · '+c.path;keys[k]=(keys[k]||0)+1});
      var opts=Object.keys(keys).sort(function(a,b){return keys[b]-keys[a]}),sel=$('mapSel');
      sel.innerHTML=opts.map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+' ('+keys[k]+')</option>'}).join('')||'<option>No clicks yet</option>';
      function drawMap(){var key=sel.value,pts=clicks.filter(function(c){return(c.site+' · '+c.path)===key});
        $('mapCount').textContent=pts.length?pts.length+' clicks':'';
        $('map').innerHTML=pts.map(function(p){return '<div class="dot" title="'+esc(p.target)+'" style="left:'+(Math.max(0,Math.min(1,p.x))*100)+'%;top:'+(Math.max(0,Math.min(1,p.y))*100)+'%"></div>'}).join('');}
      drawMap(); sel.onchange=drawMap;
    }

    // ---- controls ----
    $('tabs').addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});
      var m=b.dataset.t==='metrics';
      $('paneSponsors').hidden=m; $('paneMetrics').hidden=!m; $('rangeSeg').hidden=!m;
    });
    $('rangeSeg').addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return; days=+b.dataset.d;
      [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});
      loadMetrics();
    });
    $('refresh').addEventListener('click',reload);
    $('logout').addEventListener('click',function(){ location.reload(); });
  })();
  </script>
</body>
</html>
