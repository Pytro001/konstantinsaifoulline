<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast — Konstantin Saifoulline</title>
  <meta name="description" content="The Konstantin Saifoulline podcast.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f5f2;--card:#fff;--ink:#141414;--dim:#6a6a6a;--dim2:#9a9a9a;
      --line:rgba(0,0,0,.10);--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;overscroll-behavior:none}
    body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1000px;margin:0 auto;padding:0 1.4rem}

    .top{position:sticky;top:0;z-index:50;background:var(--bg)}
    .top .wrap{display:flex;align-items:center;justify-content:flex-end;gap:1.1rem;height:62px}
    .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.85rem}
    .brand .back{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);color:var(--dim)}
    .brand .back:hover{color:var(--ink);border-color:var(--ink)}
    .top-right{display:flex;align-items:center;gap:1rem}
    .navlink{font-size:.85rem;font-weight:600;color:var(--ink)}
    .plat{display:flex;gap:.35rem;align-items:center}
    .plat a{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center}
    /* optically balanced so every logo reads the same size */
    .plat svg{width:20px;height:20px;fill:currentColor}
    .plat a[data-b=applepodcasts] svg{width:17px;height:17px}
    .plat a[data-b=spotify] svg{width:18px;height:18px}
    .plat a[data-b=youtube] svg{width:19px;height:19px}
    .plat a[data-b=x] svg{width:20px;height:20px}
    .plat a[data-b=amazonmusic] svg{width:23px;height:23px}
    .plat a[data-b=deezer] svg{width:23px;height:23px}
    .plat a[data-b=youtube]{color:#FF0000}
    .plat a[data-b=applepodcasts]{color:#9933CC}
    .plat a[data-b=spotify]{color:#1DB954}
    .plat a[data-b=amazonmusic]{color:#25D1DA}
    .plat a[data-b=deezer]{color:#A238FF}
    .plat a[data-b=x]{color:#000}

    .hero{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1.2rem;z-index:1}
    .content{position:relative;z-index:2;background:var(--bg);margin-top:calc(100vh - 62px);margin-top:calc(100svh - 62px)}
    .name{width:min(92vw,1060px);height:auto;display:block}
    .name text{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:150px;fill:var(--ink)}

    .latest{margin:1rem 0 2rem}
    .video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 12px 44px rgba(0,0,0,.12)}
    .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
    .latest .info{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-top:1rem;flex-wrap:wrap}
    .latest .lbl{font-size:.78rem;font-weight:600;color:var(--dim2)}
    .latest h2{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;letter-spacing:-.02em}
    .latest .date{color:var(--dim2);font-size:.85rem}

    .sec{margin-top:4rem}
    .sec h3{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--dim);text-transform:uppercase;margin-bottom:1.1rem}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
    .ep{display:block;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;position:relative}
    .ep img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
    .ep:hover img{transform:scale(1.04)}
    .empty{color:var(--dim2);font-size:.95rem}

    footer{margin:5rem 0 3rem;text-align:center;color:var(--dim2);font-size:.82rem}
    footer .plat{justify-content:center;margin-bottom:1.1rem}
    @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="top">
    <div class="wrap">
      <nav class="plat" id="platTop" aria-label="Listen on"></nav>
      <a class="navlink" href="/sponsor">Sponsor?</a>
    </div>
  </div>

  <div class="hero">
    <svg class="name" viewBox="0 0 1000 300" role="img" aria-label="Konstantin Saifoulline" preserveAspectRatio="xMidYMid meet">
      <text x="500" y="128" text-anchor="middle" textLength="1000" lengthAdjust="spacingAndGlyphs">KONSTANTIN</text>
      <text x="500" y="280" text-anchor="middle" textLength="1000" lengthAdjust="spacingAndGlyphs">SAIFOULLINE</text>
    </svg>
  </div>

  <div class="content">
  <main class="wrap">
    <section class="latest">
      <div class="video">
        <iframe id="ytEmbed" src="about:blank" title="Latest episode"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
      </div>
      <div class="info">
        <h2 id="latestTitle">Loading…</h2>
        <div class="date" id="latestDate"></div>
      </div>
    </section>

    <section class="sec">
      <h3>Episodes</h3>
      <div class="grid" id="epGrid"></div>
      <div class="empty" id="epEmpty" hidden>This is a new part of the journey — the first episodes of the rebranded podcast will land here.</div>
    </section>
  </main>

  <footer>
    <nav class="plat" id="platBottom" aria-label="Listen on"></nav>
    <div>© <span id="yr"></span> Konstantin Saifoulline · <a href="/" style="text-decoration:underline">back to site</a></div>
  </footer>
  </div>

      amazonmusic:'<svg viewBox="0 0 24 24"><rect x="1.5" y="10.5" width="2.4" height="3" rx="1.2"/><rect x="5.4" y="7.5" width="2.4" height="9" rx="1.2"/><rect x="9.3" y="4" width="2.4" height="16" rx="1.2"/><rect x="13.2" y="8" width="2.4" height="8" rx="1.2"/><rect x="17.1" y="6" width="2.4" height="12" rx="1.2"/><rect x="21" y="9.5" width="2.4" height="5" rx="1.2"/></svg>',
      deezer:'<svg viewBox="0 0 24 24"><path d="M.693 10.024c.381 0 .693-1.256.693-2.807 0-1.55-.312-2.807-.693-2.807C.312 4.41 0 5.666 0 7.217s.312 2.808.693 2.808ZM21.038 1.56c-.364 0-.684.805-.91 2.096C19.765 1.446 19.184 0 18.526 0c-.78 0-1.464 2.036-1.784 5-.312-2.158-.788-3.536-1.325-3.536-.745 0-1.386 2.704-1.62 6.472-.442-1.932-1.083-3.145-1.793-3.145s-1.35 1.213-1.793 3.145c-.234-3.768-.875-6.472-1.62-6.472-.537 0-1.013 1.378-1.325 3.536C6.938 2.036 6.262 0 5.474 0c-.658 0-1.239 1.446-1.602 3.656-.226-1.291-.546-2.096-.91-2.096-.675 0-1.221 2.807-1.221 6.273 0 3.465.546 6.272 1.221 6.272.277 0 .537-.476.736-1.273.32 2.928.996 4.938 1.776 4.938.606 0 1.143-1.204 1.507-3.11.251 3.622.875 6.195 1.602 6.195.46 0 .875-1.023 1.187-2.677C10.142 21.6 11 24 12.004 24c1.005 0 1.863-2.4 2.235-5.822.312 1.654.727 2.677 1.186 2.677.728 0 1.352-2.573 1.603-6.195.364 1.906.9 3.11 1.507 3.11.78 0 1.455-2.01 1.775-4.938.208.797.46 1.273.737 1.273.675 0 1.22-2.807 1.22-6.272-.008-3.457-.553-6.273-1.23-6.273Z"/></svg>',

    };

      {b:'youtube',name:'YouTube',url:'https://www.youtube.com/@konstantinsaifo'},
      {b:'applepodcasts',name:'Apple Podcasts',url:'https://podcasts.apple.com/us/podcast/konstantin-saifoulline/id6796254399'},
      {b:'spotify',name:'Spotify',url:'https://open.spotify.com/show/033YmXaDmzU8LCJzfdbqoM?si=40ec222f49544206'},

      {b:'x',name:'X',url:'https://x.com/konstantinsaifo'}
    ];
    function renderPlat(el){ el.innerHTML=PLATFORMS.map(function(p){ return '<a data-b="'+p.b+'" href="'+p.url+'" target="_blank" rel="noopener" aria-label="'+p.name+'">'+IC[p.b]+'</a>'; }).join(''); }
    renderPlat($('platTop')); renderPlat($('platBottom'));

    var FALLBACK=[{id:'CFpKRfGyZWQ',title:'Why Some People Progress Faster Than Everyone Else',published:'',url:'https://www.youtube.com/watch?v=CFpKRfGyZWQ',thumbnail:'https://i.ytimg.com/vi/CFpKRfGyZWQ/maxresdefault.jpg',thumbnail_hq:'https://i.ytimg.com/vi/CFpKRfGyZWQ/hqdefault.jpg'}];
    function fmtDate(s){ if(!s) return ''; var d=new Date(s); if(isNaN(d.getTime())) return ''; return d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }
    function fb(img,hq){ img.onerror=function(){ img.onerror=null; if(hq) img.src=hq; }; }

    function render(eps){
      if(!eps||!eps.length) eps=FALLBACK;
      var latest=eps[0], rest=eps.slice(1);
      $('ytEmbed').src='https://www.youtube-nocookie.com/embed/'+latest.id+'?rel=0';
      $('latestTitle').textContent=latest.title;
      $('latestDate').textContent=fmtDate(latest.published);
      var grid=$('epGrid');
      if(!rest.length){ grid.style.display='none'; $('epEmpty').hidden=false; return; }
      grid.innerHTML=rest.map(function(e){
        return '<a class="ep" href="'+e.url+'" target="_blank" rel="noopener" title="'+e.title.replace(/"/g,'&quot;')+'"><img loading="lazy" src="'+e.thumbnail+'" data-hq="'+(e.thumbnail_hq||'')+'" alt=""></a>';
      }).join('');
      grid.querySelectorAll('img[data-hq]').forEach(function(im){ fb(im, im.getAttribute('data-hq')); });
    }
    fetch(AIRSUP+'/functions/v1/podcast-feed',{headers:{'apikey':ANON}})
      .then(function(r){return r.json()})
      .then(function(d){ render(d&&d.episodes&&d.episodes.length?d.episodes:FALLBACK); })
