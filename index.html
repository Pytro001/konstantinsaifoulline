  <style>
    :root {
      --black: #050505;
      --white: #ffffff;
      --soft: #f1f1ef;
      --gray: #777777;
      --line: #d8d8d5;
      --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --page: min(1440px, calc(100% - clamp(2rem, 5vw, 5rem)));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--white);
      color: var(--black);
      font-family: var(--sans);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }
    ::selection { background: var(--black); color: var(--white); }

    .skip-link {
      position: fixed;
      top: -5rem;
      left: 1rem;
      z-index: 100;
      padding: 0.7rem 0.9rem;
      background: var(--black);
      color: var(--white);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .skip-link:focus { top: 1rem; }

    .announcement {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.55rem 1rem;
      background: var(--black);
      color: var(--white);
      font-size: 0.69rem;
      letter-spacing: 0.04em;
      text-align: center;
      white-space: nowrap;
    }
    .announcement-title {
      max-width: min(720px, 65vw);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 0 clamp(1rem, 3vw, 2.5rem);
      background: rgba(255, 255, 255, 0.96);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .logo {
      font-family: var(--display);
      font-size: 1.17rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.72;
      text-transform: uppercase;
    }
    .logo span { display: block; }
    .nav { display: flex; align-items: center; gap: clamp(1.2rem, 3vw, 2.6rem); }
    .nav a {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero {
      position: fixed;
      top: 62px;
      left: 0;
      right: 0;
      height: calc(100svh - 62px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(4rem, 10vh, 7rem) 1rem 0;
      z-index: 4;
      overflow: visible;
      background: transparent;
      pointer-events: none;
    }
    .hero-title {
      position: relative;
      z-index: 1;
      margin-top: 0.75rem;
      font-family: var(--display);
      font-size: clamp(5.7rem, 15vw, 14rem);
      font-weight: 800;
      letter-spacing: -0.052em;
      line-height: 0.78;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .hero-title span { display: block; }
    .hero-portrait {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: -2px;
      width: clamp(440px, 46vw, 700px);
      height: min(80%, 720px);
      max-width: none;
      object-fit: cover;
      object-position: center 10%;
      filter: grayscale(1) contrast(1.08);
      transform: translateX(-50%);
      will-change: opacity, transform;
    }
    .platform-icons {
      position: fixed;
      z-index: 8;
      right: 1.15rem;
      top: 50%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(calc(-50% + 22px));
    }
    .platform-icons a {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: #111;
    }
    .platform-icons svg { width: 22px; height: 22px; display: block; fill: currentColor; }
    .platform-icons a:hover { color: var(--brand); }
    .platform-icons a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    @media (max-width: 700px) {
      .platform-icons {
        top: auto;
        right: 0;
        left: 0;
        bottom: max(0.75rem, env(safe-area-inset-bottom));
        flex-direction: row;
        justify-content: center;
        gap: 1.15rem;
      }
      .platform-icons svg { width: 22px; height: 22px; }
    }

    .footer {
      padding: 1.35rem 0 1.15rem;
      background: var(--black);
      color: var(--white);
      position: relative;
      z-index: 6;
    }
    .footer-inner {
      width: var(--page);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .footer-top { display: flex; align-items: flex-start; justify-content: flex-end; gap: 2rem; }
    .platforms { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.55rem 1.2rem; max-width: 470px; }
    .platforms a { font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; }
    .platforms a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: #999;
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

    @media (max-width: 800px) {
      .hero { padding-top: 4rem; }
      .hero-title { font-size: clamp(5rem, 20vw, 9rem); }
      .hero-portrait { width: min(76vw, 600px); height: 74%; object-position: center 8%; }
      .platforms { justify-content: flex-start; }
    }

    @media (max-width: 560px) {
      :root { --page: calc(100% - 2rem); }
      .announcement-title { max-width: 62vw; }
      .header { min-height: 58px; }
      .header { gap: 0.7rem; }
      .nav { gap: 0.75rem; }
      .nav a { font-size: 0.6rem; }
      .hero { top: 58px; height: calc(100svh - 58px); padding-top: 3.8rem; }
      .hero-title { width: 100%; font-size: clamp(2.7rem, 15.5vw, 6rem); white-space: normal; }
      .hero-portrait { width: min(100vw, 460px); height: 66%; object-position: center 8%; }
      .footer-bottom { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }

    window.addEventListener('scroll', placeIcons, { passive: true });
    window.addEventListener('resize', placeIcons);
    placeIcons();
    $('year').textContent = new Date().getFullYear();
  })();
  </script>
