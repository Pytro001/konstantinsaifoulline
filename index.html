<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konstantin Saifoulline</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav">
    <div class="nav-links">
      <a href="#bookshelf">Library</a>
      <a href="https://www.airsup.ai/podcast">Podcast</a>
      <a href="https://pytromusic.com" target="_blank" rel="noopener noreferrer">Music</a>
      <a href="doc/">Doc</a>
    </div>
    <button class="nav-toggle" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <main>
    <section id="top" class="hero">
      <h1 class="hero-title">
        <span class="hero-line">Konstantin</span>
        <span class="hero-line">Saifoulline</span>
      </h1>
    </section>

    <section id="bookshelf" class="section bookshelf-section">
      <h2 class="section-title">Library</h2>
      <div class="bookshelf-content" id="bookshelfContent">
        <p class="bookshelf-hint">Scroll down to browse books →</p>
        <div class="books-carousel-viewport" id="booksCarouselViewport">
          <div class="books-carousel" id="booksCarousel" aria-label="Book covers"></div>
        </div>
        <p class="books-carousel-counter" id="booksCarouselCounter" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-socials">
      <a href="https://www.instagram.com/konstantinsaifo/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://www.youtube.com/@konstantinsaifo" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://www.linkedin.com/in/konstantinsaifoulline/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://x.com/konstantinsaifo" target="_blank" rel="noopener noreferrer">X</a>
      <a href="https://www.airsup.dev/" target="_blank" rel="noopener noreferrer">airsup</a>
    </div>
  </footer>

  <div class="book-modal" id="bookModal" hidden>
    <div class="book-modal-backdrop" id="bookModalBackdrop"></div>
    <div class="book-modal-panel" role="dialog" aria-modal="true" aria-labelledby="bookModalTitle">
      <button type="button" class="book-modal-close" id="bookModalClose" aria-label="Close">×</button>
      <div class="book-modal-cover-wrap">
        <img class="book-modal-cover" id="bookModalCover" alt="">
      </div>
      <h3 class="book-modal-title" id="bookModalTitle"></h3>
      <p class="book-modal-author" id="bookModalAuthor"></p>
      <div class="book-modal-notes" id="bookModalNotes"></div>
    </div>
  </div>

  <script src="books.js"></script>
  <script src="script.js"></script>
  <script src="/assets/track.js" data-site="konstantinsaifoulline" defer></script>
</body>
</html>
