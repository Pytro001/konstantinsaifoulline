<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Konstantin Saifoulline</title>
  <meta name="description" content="Every book Konstantin Saifoulline has read.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111;
      --muted: #5c5c5c;
      --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; }
    body {
      min-height: 100svh;
      background: #fff;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    .back {
      position: absolute;
      top: 1.4rem;
      left: clamp(1.1rem, 3vw, 2.2rem);
      z-index: 3;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .back:focus-visible, .book:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .runway { position: relative; background: #fff; }
    .stage {
      position: sticky;
      top: 0;
      height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: #fff;
      padding-top: 4.2rem;
    }
    h1 {
      padding: 0 clamp(1.1rem, 3vw, 2.4rem);
      font-family: var(--display);
      font-size: clamp(2.2rem, 4.2vw, 3.4rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.9;
      text-transform: uppercase;
    }
    .viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .shelf {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      gap: clamp(1.1rem, 2vw, 1.8rem);
      will-change: transform;
    }
    .book {
      flex: 0 0 auto;
      width: clamp(160px, 16vw, 220px);
      transform-origin: center center;
    }
    .cover {
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #f7f7f7;
      border-radius: 8px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.06);
    }
    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .caption {
      flex: 0 0 auto;
      padding: 0.4rem clamp(1.1rem, 3vw, 2.4rem) max(1.5rem, env(safe-area-inset-bottom));
    }
    .caption h2 {
      max-width: 36ch;
      font-family: var(--sans);
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .caption p {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 400;
    }
    .runway.is-static { height: auto !important; }
    .runway.is-static .stage {
      position: relative;
      height: auto;
      overflow: visible;
    }
    .runway.is-static .viewport { height: auto; overflow: visible; }
    .runway.is-static .shelf {
      position: relative;
      height: auto;
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.6rem 1.1rem;
      padding: 0 0 4rem;
      transform: none !important;
    }
    .runway.is-static .book { width: auto; }
    .runway.is-static .book h3 {
      margin-top: 0.55rem;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
    }
    @media (max-width: 700px) {
      h1 { font-size: clamp(1.7rem, 8vw, 2.2rem); }
      .book { width: 150px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cover, .book { transition: none; }
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Podcast</a>
  <main>
    <section class="runway" id="runway" aria-label="Books">
      <div class="stage">
        <h1>Books I've read</h1>
        <div class="viewport" id="viewport">
          <div class="shelf" id="shelf"></div>
        </div>
        <div class="caption">
          <h2 id="bookTitle"></h2>
          <p id="bookAuthor"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="/books.js"></script>
  <script>
  (function () {
    var books = window.BOOKS || [];
    var shelf = document.getElementById('shelf');
    var runway = document.getElementById('runway');
    var title = document.getElementById('bookTitle');
    var author = document.getElementById('bookAuthor');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var current = -1;

    books.forEach(function (book, index) {
      var article = document.createElement('article');
      article.className = 'book';
      var cover = document.createElement('div');
      cover.className = 'cover';
      var image = document.createElement('img');
      image.alt = book.title;
      image.src = '/assets/books/' + book.id + '.jpg';
      if (index > 5) image.loading = 'lazy';
      image.onerror = function () {
        image.onerror = null;
        image.src = '/assets/books/' + book.id + '.svg';
      };
      cover.appendChild(image);
      article.appendChild(cover);
      if (reduce) {
        var label = document.createElement('h3');
        label.textContent = book.title;
        article.appendChild(label);
      }
      shelf.appendChild(article);
    });

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function stride() {
      var book = shelf.children[0];
      if (!book) return 1;
      var gap = parseFloat(getComputedStyle(shelf).columnGap || getComputedStyle(shelf).gap) || 0;
      return book.offsetWidth + gap;
    }

    function measure() {
      if (reduce || books.length < 2) {
        runway.classList.add('is-static');
        runway.style.height = 'auto';
        return;
      }
      runway.classList.remove('is-static');
      var stage = runway.querySelector('.stage');
      var steps = books.length - 1;
      runway.style.height = (stage.offsetHeight + steps * Math.max(window.innerHeight * 0.34, 240)) + 'px';
    }

    function render() {
      if (reduce || !books.length || runway.classList.contains('is-static')) {
        if (books[0]) {
          title.textContent = books[0].title;
          author.textContent = books[0].author;
        }
        return;
      }
      var stage = runway.querySelector('.stage');
      var stick = runway.offsetTop;
      var travel = Math.max(1, runway.offsetHeight - stage.offsetHeight);
      var progress = clamp((window.scrollY - stick) / travel, 0, 1);
      var t = progress * (books.length - 1);
      var index = clamp(Math.round(t), 0, books.length - 1);
      var step = stride();
      var center = runway.querySelector('.viewport').clientWidth / 2 - step / 2;
      shelf.style.transform = 'translate3d(' + (center - t * step) + 'px,0,0)';

      Array.prototype.forEach.call(shelf.children, function (book, i) {
        var distance = Math.abs(i - t);
        var near = Math.max(0, 1 - distance / 1.6);
        var scale = 0.9 + near * 0.1;
        var lift = near * 8;
        book.style.transform = 'translateY(' + (-lift) + 'px) scale(' + scale + ')';
        book.style.zIndex = String(Math.round(near * 10));
      });

      if (index !== current) {
        current = index;
        title.textContent = books[index].title;
        author.textContent = books[index].author;
      }
    }

    measure();
    render();
    window.addEventListener('scroll', function () { requestAnimationFrame(render); }, { passive: true });
    window.addEventListener('resize', function () { measure(); render(); });
  })();
  </script>
  <script src="/assets/track.js" data-site="konstantinsaifoulline-library" defer></script>
</body>
</html>
