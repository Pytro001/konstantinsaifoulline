<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Library — Konstantin Saifoulline</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/books/books-wall.css">
</head>
<body>
  <!-- Spatial wall of every book cover -->
  <div id="wall" class="wall" aria-label="Library wall"></div>

  <!-- Light that follows the focus point -->
  <div class="focus-light" id="focusLight" aria-hidden="true"></div>

  <div class="vignette" aria-hidden="true"></div>

  <!-- Top bar: back home -->
  <div class="top-bar">
    <a class="icon-btn" href="/" aria-label="Back to home" title="Back to home">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>

  <!-- Ambient title + hint -->
  <div class="stage-title" aria-hidden="true">
    <span class="stage-title-main">The Library</span>
    <span class="stage-title-sub">Move to explore · click a book</span>
  </div>

  <!-- Detail card (slides in from the right) -->
  <aside id="detail" class="detail" aria-live="polite">
    <button class="detail-close-x" id="detailCloseX" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="detail-inner">
      <div class="detail-cover-wrap">
        <img class="detail-cover" id="detailCover" alt="">
      </div>
      <h1 class="detail-title" id="detailTitle"></h1>
      <p class="detail-author" id="detailAuthor"></p>
      <div class="detail-tags" id="detailTags"></div>
      <p class="detail-desc" id="detailDesc"></p>
      <div class="detail-actions">
        <a class="pill-btn" id="linkGoogle" target="_blank" rel="noopener noreferrer">Google Books</a>
        <a class="pill-btn" id="linkGoodreads" target="_blank" rel="noopener noreferrer">Goodreads</a>
        <button class="pill-btn icon-only" id="favBtn" aria-label="Save to favorites" title="Save">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </button>
        <button class="pill-btn ghost" id="detailClose">Close</button>
      </div>
    </div>
  </aside>

  <script src="/books.js"></script>
  <script src="/books/books-wall.js"></script>
</body>
</html>
