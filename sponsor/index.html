<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsor — Konstantin Saifoulline</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f5f2;--card:#fff;--ink:#141414;--dim:#6a6a6a;--dim2:#9a9a9a;--line:rgba(0,0,0,.10);--font:'Inter',-apple-system,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:560px;margin:0 auto;padding:0 1.4rem}
    .top{border-bottom:1px solid rgba(0,0,0,.05)}
    .top .wrap{max-width:1000px;display:flex;align-items:center;gap:.6rem;height:62px;font-weight:700;font-size:.85rem}
    .top .back{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);color:var(--dim)}
    .top .back:hover{color:var(--ink);border-color:var(--ink)}
    main{padding:4.5rem 0 4rem}
    h1{font-weight:900;font-size:clamp(2.2rem,7vw,3.2rem);letter-spacing:-.03em;line-height:1}
    .lede{color:var(--dim);margin:1rem 0 2.2rem;font-size:1rem}
    form{display:grid;gap:.8rem}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
    label{display:block;font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;color:var(--dim2);font-weight:600;margin-bottom:.3rem}
    input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.75rem .85rem;font:inherit;font-size:.92rem;color:var(--ink)}
    textarea{min-height:100px;resize:vertical}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#111}
    button{margin-top:.4rem;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:.85rem 1.3rem;font:inherit;font-weight:600;cursor:pointer}
    button:hover{opacity:.9}
    .msg{font-size:.88rem;min-height:1.1em;margin-top:.2rem}
    .msg.ok{color:#1a7a3a}.msg.err{color:#b00}
    @media(max-width:560px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="top"><div class="wrap">
    <a class="back" href="/podcast" aria-label="Back to podcast"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span>Konstantin&nbsp;Saifoulline</span>
  </div></div>

  <main class="wrap">
    <h1>Sponsor the show</h1>
    <p class="lede">Tell me about your company and I’ll come back with placement and rates.</p>
    <form id="f" novalidate>
      <div class="row">
        <div><label for="company">Company</label><input id="company" type="text" required></div>
        <div><label for="contact_name">Your name</label><input id="contact_name" type="text"></div>
      </div>
      <div class="row">
        <div><label for="email">Email</label><input id="email" type="email" required></div>
        <div><label for="website">Website</label><input id="website" type="text"></div>
      </div>
      <div><label for="budget">Monthly budget</label>
        <select id="budget">
          <option value="">Select…</option>
          <option>Under $1,000</option><option>$1,000 – $5,000</option>
          <option>$5,000 – $15,000</option><option>$15,000+</option>
        </select>
      </div>
      <div><label for="message">What do you want to promote?</label><textarea id="message"></textarea></div>
      <button type="submit" id="btn">Apply to sponsor</button>
      <p class="msg" id="msg" aria-live="polite"></p>
    </form>
  </main>

  <script>
  (function(){
    var AIRSUP='https://fyxqdwhqposxitexydby.supabase.co';
    var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5eHFkd2hxcG9zeGl0ZXh5ZGJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNzk5MDgsImV4cCI6MjA5MTc1NTkwOH0.cvpnWJvVsQx_qEk4hNDAtJZ_M8qNv4RNnhRJBRgulg8';
    var $=function(id){return document.getElementById(id)};
    $('f').addEventListener('submit',function(e){
      e.preventDefault();
      var msg=$('msg'),btn=$('btn');
      var payload={company:$('company').value.trim(),contact_name:$('contact_name').value.trim(),email:$('email').value.trim(),website:$('website').value.trim(),budget:$('budget').value,message:$('message').value.trim()};
      if(!payload.company||!payload.email){ msg.className='msg err'; msg.textContent='Please add your company and email.'; return; }
      btn.disabled=true; btn.textContent='Sending…'; msg.className='msg'; msg.textContent='';
      fetch(AIRSUP+'/rest/v1/rpc/submit_sponsor_app',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({payload:payload})})
        .then(function(r){ if(!r.ok) throw new Error(); msg.className='msg ok'; msg.textContent='Thanks — your application is in.'; e.target.reset(); })
        .catch(function(){ msg.className='msg err'; msg.textContent='Something went wrong. Please try again.'; })
        .finally(function(){ btn.disabled=false; btn.textContent='Apply to sponsor'; });
    });
  })();
  </script>
</body>
</html>
