<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Sponsoring inquiries for the Konstantin Saifoulline Podcast.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0f1011;--muted:#777b7f;--line:#dedede;--font:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;background:#fff;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .back{position:absolute;top:2rem;left:clamp(1.25rem,4vw,3.5rem);font-size:.8rem;font-weight:600}
    .back:focus-visible,.email:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
    main{min-height:100svh;display:grid;place-content:center;width:min(780px,calc(100% - 2.5rem));margin:0 auto;padding:7rem 0;text-align:center}
    h1{font-size:clamp(3.4rem,10vw,8.2rem);font-weight:500;letter-spacing:-.075em;line-height:.9}
    p{max-width:540px;margin:1.8rem auto 1.25rem;color:var(--muted);font-size:clamp(.95rem,1.6vw,1.1rem);line-height:1.6}
    .email{display:inline-block;border-bottom:1px solid var(--ink);padding-bottom:.18rem;font-size:clamp(1.05rem,2.2vw,1.35rem);font-weight:600}
  </style>
</head>
<body>
  <a class="back" href="/">← Podcast</a>
  <main>
    <div>
      <h1>Sponsoring</h1>
      <p>For sponsorships and partnerships, send an email and we can take it from there.</p>
      <a class="email" href="mailto:konstantin@airsup.ai">konstantin@airsup.ai</a>
    </div>
  </main>
  <script src="/assets/track.js" data-site="konstantinsaifoulline-sponsor" defer></script>
</body>
</html>
